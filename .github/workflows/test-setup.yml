name: Test setup scripts

on:
  push:
    paths:
      - 'setup/**'
      - 'exercises/**'
      - '.github/workflows/test-setup.yml'
  pull_request:
    paths:
      - 'setup/**'
      - 'exercises/**'

jobs:
  # ── Mac (arm64) ───────────────────────────────────────────────
  test-mac:
    name: Mac (arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run setup script
        run: bash setup/setup.command

      - name: Verify Python runtime was installed
        run: |
          if [ ! -f "python-runtime/mac-arm64/bin/python3" ]; then
            echo "ERROR: Python runtime not found"
            exit 1
          fi
          echo "Runtime OK: $(python-runtime/mac-arm64/bin/python3 --version)"

      - name: Verify smoke test passes
        run: python-runtime/mac-arm64/bin/python3 exercises/music_data.py

  # ── Windows ──────────────────────────────────────────────────
  test-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run setup script
        shell: cmd
        run: setup\setup.bat

      - name: Verify Python runtime was installed
        shell: cmd
        run: |
          if not exist "python-runtime\windows\python.exe" (
            echo ERROR: Python runtime not found
            exit /b 1
          )
          for /f "tokens=*" %%v in ('python-runtime\windows\python.exe --version') do echo Runtime OK: %%v

      - name: Verify smoke test passes
        shell: cmd
        run: python-runtime\windows\python.exe exercises\music_data.py
